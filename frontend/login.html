<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar Sesión | Gestión NAP - Municipio Plaza</title>

  <!-- Tailwind CSS (CDN Desarrollo) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Fuente Inter y JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col justify-center items-center p-4 relative overflow-hidden">

  <!-- Fondo decorativo sutil -->
  <div class="pointer-events-none absolute inset-0 bg-[radial-gradient(circle_at_top,_rgba(16,185,129,0.08),_transparent_55%)]"></div>

  <main class="w-full max-w-md relative z-10">
    <!-- Tarjeta de Autenticación -->
    <div class="bg-slate-900/90 backdrop-blur-md border border-slate-800 rounded-2xl shadow-2xl overflow-hidden">

      <!-- Cabecera -->
      <div class="px-6 pt-8 pb-6 border-b border-slate-800/80 text-center">
        <div class="w-12 h-12 rounded-xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400 mx-auto mb-4">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" />
          </svg>
        </div>
        <h1 class="text-lg font-bold text-white tracking-tight">
          Gestión NAP <span class="text-slate-400 font-normal">| Municipio Plaza</span>
        </h1>
        <p class="text-xs text-slate-400 mt-1">
          Sistema GIS y Telemetría Óptica FTTH — Guarenas
        </p>
      </div>

      <!-- Formulario -->
      <div class="p-6 sm:p-8">
        <!-- Alerta de Error -->
        <div
          id="login-error-box"
          role="alert"
          aria-live="assertive"
          class="hidden mb-5 p-3.5 rounded-xl bg-rose-950/70 border border-rose-500/40 text-rose-200 text-xs flex items-start gap-2.5"
        >
          <svg class="w-4 h-4 text-rose-400 shrink-0 mt-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          <span id="login-error-text">Credenciales inválidas.</span>
        </div>

        <form id="login-form" novalidate class="space-y-4">
          <!-- Usuario / Correo -->
          <div>
            <label for="username" class="block text-xs font-semibold text-slate-300 mb-1.5">
              Usuario o Correo Institucional
            </label>
            <input
              type="text"
              id="username"
              name="username"
              required
              autocomplete="username"
              spellcheck="false"
              placeholder="operador@gestionnap.ve"
              class="w-full px-3.5 py-2.5 text-sm text-white bg-slate-950 border border-slate-700 rounded-xl placeholder:text-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-colors"
            />
          </div>

          <!-- Contraseña -->
          <div>
            <label for="password" class="block text-xs font-semibold text-slate-300 mb-1.5">
              Contraseña
            </label>
            <div class="relative">
              <input
                type="password"
                id="password"
                name="password"
                required
                autocomplete="current-password"
                placeholder="••••••••"
                class="w-full px-3.5 py-2.5 pr-10 text-sm text-white bg-slate-950 border border-slate-700 rounded-xl placeholder:text-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-colors"
              />
              <button
                type="button"
                id="toggle-password-btn"
                aria-pressed="false"
                aria-label="Mostrar u ocultar contraseña"
                class="absolute inset-y-0 right-0 px-3 flex items-center text-slate-400 hover:text-slate-200 transition-colors cursor-pointer"
              >
                <svg id="eye-icon" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
              </button>
            </div>
          </div>

          <!-- Botón de Envío -->
          <button
            type="submit"
            id="login-submit-btn"
            class="w-full mt-2 py-2.5 px-4 bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white text-sm font-semibold rounded-xl shadow-lg shadow-emerald-950/50 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2 focus:ring-offset-slate-900 disabled:opacity-50 disabled:cursor-not-allowed transition-all flex items-center justify-center gap-2 cursor-pointer"
          >
            <svg id="login-spinner" class="hidden w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
            </svg>
            <span id="login-btn-text">Ingresar al Sistema</span>
          </button>
        </form>
      </div>

      <!-- Pie de tarjeta -->
      <div class="px-6 py-3.5 bg-slate-950/60 border-t border-slate-800/80 flex items-center justify-between text-[11px] text-slate-500 font-mono">
        <span>FTTH-GPON · Z01–Z08</span>
        <span id="api-status-badge" class="text-slate-400">API v1</span>
      </div>
    </div>
  </main>

  <script>
    // Detecta automáticamente si se sirve detrás del mismo host o en puerto local 8000
    const DEFAULT_API_BASE = window.location.port === '8000'
      ? `${window.location.origin}/api/v1`
      : `${window.location.protocol}//${window.location.hostname || 'localhost'}:8000/api/v1`;

    const AUTH_CONFIG = {
      apiBaseUrl: DEFAULT_API_BASE,
      loginEndpoint: '/auth/login', // Ajustar a '/auth/token' si tu router usa esa ruta
      useOAuth2Form: true,          // true = application/x-www-form-urlencoded (OAuth2PasswordRequestForm) | false = JSON
      requestTimeoutMs: 10000,
      redirectAfterLogin: 'index.html'
    };

    const form = document.getElementById('login-form');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const togglePasswordBtn = document.getElementById('toggle-password-btn');
    const submitBtn = document.getElementById('login-submit-btn');
    const spinner = document.getElementById('login-spinner');
    const btnText = document.getElementById('login-btn-text');
    const errorBox = document.getElementById('login-error-box');
    const errorText = document.getElementById('login-error-text');

    let isSubmitting = false;

    // Verificar si ya existe un token JWT con estructura válida y no expirado
    (function checkExistingSession() {
      try {
        const token = localStorage.getItem('access_token');
        if (!token) return;
        const parts = token.split('.');
        if (parts.length !== 3) {
          localStorage.removeItem('access_token');
          localStorage.removeItem('token_type');
          return;
        }
        const payload = JSON.parse(atob(parts[1].replace(/-/g, '+').replace(/_/g, '/')));
        if (payload.exp && payload.exp * 1000 > Date.now()) {
          window.location.replace(AUTH_CONFIG.redirectAfterLogin);
        } else {
          localStorage.removeItem('access_token');
          localStorage.removeItem('token_type');
        }
      } catch (_) {
        // Si el storage está bloqueado o el token corrupto, continuar en login
      }
    })();

    togglePasswordBtn.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      togglePasswordBtn.setAttribute('aria-pressed', String(isPassword));
    });

    function showError(message) {
      errorText.textContent = message;
      errorBox.classList.remove('hidden');
    }

    function hideError() {
      errorBox.classList.add('hidden');
    }

    function setLoading(loading) {
      isSubmitting = loading;
      submitBtn.disabled = loading;
      spinner.classList.toggle('hidden', !loading);
      btnText.textContent = loading ? 'Verificando credenciales...' : 'Ingresar al Sistema';
    }

    function extractFastApiError(payload, status) {
      if (status === 429) {
        return 'Demasiados intentos fallidos. Espera unos segundos antes de volver a intentar.';
      }
      if (!payload) return `Error del servidor (HTTP ${status}).`;
      if (typeof payload.detail === 'string') return payload.detail;
      if (Array.isArray(payload.detail) && payload.detail.length > 0) {
        return payload.detail.map((e) => e.msg || 'Dato inválido').join(' · ');
      }
      return `No se pudo iniciar sesión (HTTP ${status}).`;
    }

    function persistSessionToken(token, tokenType) {
      try {
        localStorage.setItem('access_token', token);
        localStorage.setItem('token_type', tokenType || 'bearer');
        return true;
      } catch (_) {
        showError('El navegador bloqueó el almacenamiento local. Desactiva el bloqueo de cookies/datos del sitio para iniciar sesión.');
        return false;
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (isSubmitting) return;
      hideError();

      // Ocultar contraseña antes de enviar para evitar historial en texto plano
      passwordInput.type = 'password';
      togglePasswordBtn.setAttribute('aria-pressed', 'false');

      const username = usernameInput.value.trim();
      const password = passwordInput.value;

      if (!username || !password) {
        showError('Ingresa tu usuario y contraseña para continuar.');
        return;
      }

      setLoading(true);
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), AUTH_CONFIG.requestTimeoutMs);

      try {
        const headers = {};
        let body;

        if (AUTH_CONFIG.useOAuth2Form) {
          headers['Content-Type'] = 'application/x-www-form-urlencoded';
          const formData = new URLSearchParams();
          formData.append('username', username);
          formData.append('password', password);
          body = formData;
        } else {
          headers['Content-Type'] = 'application/json';
          body = JSON.stringify({ username, password });
        }

        const response = await fetch(`${AUTH_CONFIG.apiBaseUrl}${AUTH_CONFIG.loginEndpoint}`, {
          method: 'POST',
          headers,
          body,
          signal: controller.signal
        });

        const data = await response.json().catch(() => null);

        if (!response.ok) {
          passwordInput.value = '';
          showError(extractFastApiError(data, response.status));
          return;
        }

        if (!data || typeof data.access_token !== 'string' || !data.access_token) {
          showError('El servidor respondió correctamente pero no devolvió un token de acceso válido.');
          return;
        }

        if (persistSessionToken(data.access_token, data.token_type)) {
          passwordInput.value = '';
          window.location.replace(AUTH_CONFIG.redirectAfterLogin);
        }
      } catch (err) {
        if (err.name === 'AbortError') {
          showError('Tiempo de espera agotado al contactar el servidor. Intenta nuevamente.');
        } else {
          showError('No se pudo conectar con el servidor backend (verifica que Uvicorn esté activo).');
        }
      } finally {
        clearTimeout(timeoutId);
        setLoading(false);
      }
    });
  </script>
</body>
</html>
