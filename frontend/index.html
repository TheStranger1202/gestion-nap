<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auditoría FTTH-GPON | Municipio Plaza</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 antialiased">

  <main class="max-w-4xl mx-auto px-4 py-10 space-y-6">

    <!-- Título -->
    <header class="border-b border-gray-200 pb-4">
      <p class="text-xs font-medium text-blue-600 uppercase tracking-wide">
        Redes FTTH-GPON · Municipio Plaza, Estado Miranda
      </p>
      <h1 class="text-lg font-bold text-gray-900 mt-1">
        Gestión Técnica y Auditoría de Conectividad en Cajas NAP
      </h1>
      <p id="nap-info" class="text-xs text-gray-500 mt-1 font-mono"></p>
    </header>

    <!-- Resumen + Gráfico -->
    <section class="bg-white border border-gray-200 rounded-xl p-6 grid grid-cols-1 md:grid-cols-2 gap-6 items-center">
      <!-- Porcentajes -->
      <div class="space-y-4">
        <h2 class="text-sm font-semibold text-gray-700">Estado General de Puertos</h2>

        <div class="flex items-center justify-between py-2 border-b border-gray-100">
          <span class="flex items-center gap-2 text-sm text-gray-600">
            <span class="w-2.5 h-2.5 rounded-full bg-blue-500"></span> Ocupados
          </span>
          <span id="pct-ocupados" class="text-base font-bold text-gray-900">0%</span>
        </div>

        <div class="flex items-center justify-between py-2 border-b border-gray-100">
          <span class="flex items-center gap-2 text-sm text-gray-600">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span> Libres
          </span>
          <span id="pct-libres" class="text-base font-bold text-gray-900">0%</span>
        </div>

        <div class="flex items-center justify-between py-2">
          <span class="flex items-center gap-2 text-sm text-gray-600">
            <span class="w-2.5 h-2.5 rounded-full bg-rose-500"></span> Estado Crítico
          </span>
          <span id="pct-criticos" class="text-base font-bold text-rose-600">0%</span>
        </div>
      </div>

      <!-- Gráfico Doughnut -->
      <div class="h-48 flex items-center justify-center">
        <canvas id="graficoPuertos"></canvas>
      </div>
    </section>

    <!-- Panel de Alertas -->
    <section class="bg-white border border-gray-200 rounded-xl p-6 space-y-3">
      <div class="flex items-center justify-between">
        <h2 class="text-sm font-semibold text-gray-700">Panel de Alertas</h2>
        <span id="total-alertas" class="text-xs font-medium text-rose-600 bg-rose-50 px-2.5 py-0.5 rounded-full">0</span>
      </div>
      <div id="lista-alertas" class="space-y-2"></div>
    </section>

    <!-- Tira Simple de Puertos (1 al 8) -->
    <section class="bg-white border border-gray-200 rounded-xl p-6 space-y-3">
      <h2 class="text-sm font-semibold text-gray-700">Puertos de la Caja NAP</h2>
      <div id="grid-puertos" class="grid grid-cols-4 sm:grid-cols-8 gap-2 text-center"></div>
    </section>

  </main>

  <script>
    const MOCK_RESPALDO = {
      id: 1,
      codigo_nap: "PLZ-Z04-NCA-D001-012-A",
      capacidad_puertos: 8,
      splitter_ratio: "1:8",
      tubo_color_tia598: "Azul",
      hilo_color_tia598: "Naranja",
      puertos: [
        { id: 101, numero_puerto: 1, estado_puerto: "CONECTADO", tipo_conector: "SC/APC", codigo_cliente: "CUS-88392", ultima_lectura: { potencia_rx_1490_dbm: -22.5, estado_calculado: "OPTIMO" } },
        { id: 102, numero_puerto: 2, estado_puerto: "ATENUACION_ALTA", tipo_conector: "SC/APC", codigo_cliente: "CUS-11209", ultima_lectura: { potencia_rx_1490_dbm: -28.1, estado_calculado: "CRITICO" } },
        { id: 103, numero_puerto: 3, estado_puerto: "DISPONIBLE", tipo_conector: "SC/APC", codigo_cliente: null, ultima_lectura: null }
      ]
    };

    async function cargarDashboard() {
      let data = MOCK_RESPALDO;
      try {
        const res = await fetch("./nap_detalle_mock.json");
        if (res.ok) data = await res.json();
      } catch (_) {}

      // Completar puertos hasta capacidad_puertos (8)
      const mapa = new Map(data.puertos.map(p => [p.numero_puerto, p]));
      const puertos = Array.from({ length: data.capacidad_puertos }, (_, i) =>
        mapa.get(i + 1) || { numero_puerto: i + 1, estado_puerto: "DISPONIBLE", codigo_cliente: null, ultima_lectura: null }
      );

      // Calcular conteos y porcentajes
      let ocupados = 0, libres = 0, criticos = 0;
      const alertas = [];

      puertos.forEach(p => {
        const esCritico = p.estado_puerto === "ATENUACION_ALTA" || p.ultima_lectura?.estado_calculado === "CRITICO";
        if (esCritico) {
          criticos++;
          alertas.push(p);
        } else if (p.estado_puerto === "CONECTADO") {
          ocupados++;
        } else {
          libres++;
        }
      });

      const total = data.capacidad_puertos;
      const pctOcupados = ((ocupados / total) * 100).toFixed(1);
      const pctLibres = ((libres / total) * 100).toFixed(1);
      const pctCriticos = ((criticos / total) * 100).toFixed(1);

      // Pintar cabecera y porcentajes
      document.getElementById("nap-info").textContent =
        `${data.codigo_nap} · Splitter ${data.splitter_ratio} · Tubo ${data.tubo_color_tia598} / Hilo ${data.hilo_color_tia598}`;
      document.getElementById("pct-ocupados").textContent = `${pctOcupados}% (${ocupados})`;
      document.getElementById("pct-libres").textContent = `${pctLibres}% (${libres})`;
      document.getElementById("pct-criticos").textContent = `${pctCriticos}% (${criticos})`;

      // Gráfico resumido
      new Chart(document.getElementById("graficoPuertos"), {
        type: "doughnut",
        data: {
          labels: ["Ocupados (%)", "Libres (%)", "Críticos (%)"],
          datasets: [{
            data: [pctOcupados, pctLibres, pctCriticos],
            backgroundColor: ["#3b82f6", "#10b981", "#f43f5e"],
            borderWidth: 2,
            borderColor: "#ffffff"
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          cutout: "65%",
          plugins: { legend: { display: false } }
        }
      });

      // Panel de alertas
      document.getElementById("total-alertas").textContent = `${alertas.length} activa(s)`;
      document.getElementById("lista-alertas").innerHTML = alertas.length
        ? alertas.map(a => `
            <div class="p-3 rounded-lg bg-rose-50 border border-rose-200 text-xs flex justify-between items-center">
              <span><strong>Puerto #${a.numero_puerto}</strong> · Cliente ${a.codigo_cliente} (${a.estado_puerto})</span>
              <span class="font-mono font-bold text-rose-600">${a.ultima_lectura?.potencia_rx_1490_dbm} dBm</span>
            </div>
          `).join("")
        : `<p class="text-xs text-gray-400">Sin alertas críticas.</p>`;

      // Tira de puertos 1 al 8
      document.getElementById("grid-puertos").innerHTML = puertos.map(p => {
        const esCritico = p.estado_puerto === "ATENUACION_ALTA" || p.ultima_lectura?.estado_calculado === "CRITICO";
        const color = esCritico
          ? "bg-rose-50 border-rose-300 text-rose-700"
          : p.estado_puerto === "CONECTADO"
            ? "bg-blue-50 border-blue-300 text-blue-700"
            : "bg-emerald-50 border-emerald-300 text-emerald-700";

        return `
          <div class="p-2.5 rounded-lg border ${color}">
            <div class="text-xs font-bold">P${p.numero_puerto}</div>
            <div class="text-[10px] font-mono mt-0.5">${p.ultima_lectura ? p.ultima_lectura.potencia_rx_1490_dbm + " dBm" : "Libre"}</div>
          </div>
        `;
      }).join("");
    }

    cargarDashboard();
  </script>
</body>
</html>
