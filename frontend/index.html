<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestión NAP | Mapa Operativo - Municipio Plaza</title>

  <!-- Tailwind CSS (CDN Desarrollo) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Leaflet.js CSS (CDN Desarrollo) -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <!-- Estilos personalizados GIS -->
  <link rel="stylesheet" href="assets/css/custom.css" />
</head>
<body class="bg-slate-900 text-slate-800 antialiased overflow-hidden flex flex-col h-screen">

  <!-- Barra Superior de Navegación y Telemetría Rápida -->
  <header class="h-16 bg-slate-900 border-b border-slate-800 px-4 lg:px-6 flex items-center justify-between z-20 shrink-0">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-lg bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" />
        </svg>
      </div>
      <div>
        <h1 class="text-white font-semibold text-base leading-tight tracking-tight">
          Gestión NAP <span class="text-slate-400 font-normal">| Municipio Plaza</span>
        </h1>
        <p class="text-xs text-slate-400">Red de Distribución Óptica FTTH — Guarenas</p>
      </div>
    </div>

    <!-- Indicadores Resumen (Renderizados dinámicamente) -->
    <div id="nap-stats-bar" class="hidden sm:flex items-center gap-3 text-xs font-medium">
      <span class="px-2.5 py-1 rounded-md bg-slate-800 text-slate-300 border border-slate-700">
        Total Cajas: <strong id="stat-total" class="text-white">0</strong>
      </span>
      <span class="px-2.5 py-1 rounded-md bg-emerald-950/70 text-emerald-300 border border-emerald-800/60 flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
        Óptimo: <strong id="stat-optimo" class="text-emerald-200">0</strong>
      </span>
      <span class="px-2.5 py-1 rounded-md bg-rose-950/70 text-rose-300 border border-rose-800/60 flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-rose-500 animate-ping"></span>
        Crítico: <strong id="stat-critico" class="text-rose-200">0</strong>
      </span>
    </div>
  </header>

  <!-- Contenedor Principal del Mapa -->
  <main class="relative flex-1 w-full h-full">
    <div id="map" class="w-full h-full z-10"></div>

    <!-- Leyenda Flotante GIS -->
    <aside class="absolute bottom-6 left-4 z-[1000] bg-white/95 backdrop-blur-sm border border-slate-200 rounded-xl shadow-lg p-3.5 w-60">
      <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-2.5">
        Estado General NAP
      </h2>
      <ul class="space-y-2 text-xs text-slate-700">
        <li class="flex items-center justify-between">
          <span class="flex items-center gap-2 font-medium">
            <span class="w-3 h-3 rounded-full bg-emerald-500 ring-2 ring-emerald-200"></span>
            ÓPTIMO
          </span>
          <span class="text-slate-400">Señal nominal</span>
        </li>
        <li class="flex items-center justify-between">
          <span class="flex items-center gap-2 font-medium">
            <span class="w-3 h-3 rounded-full bg-amber-500 ring-2 ring-amber-200"></span>
            ADVERTENCIA
          </span>
          <span class="text-slate-400">Atenuación leve</span>
        </li>
        <li class="flex items-center justify-between">
          <span class="flex items-center gap-2 font-medium">
            <span class="w-3 h-3 rounded-full bg-rose-600 ring-2 ring-rose-200"></span>
            CRÍTICO
          </span>
          <span class="text-slate-400">Falla / Saturación</span>
        </li>
      </ul>
    </aside>
  </main>

  <!-- Leaflet.js Core (CDN Desarrollo) -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <!-- Componentes UI y Controlador GIS -->
  <script src="assets/js/components.js"></script>
  <script src="assets/js/map.js"></script>
</body>
</html>
